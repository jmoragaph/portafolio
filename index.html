<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>María Rodríguez | Fotografía</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <div class="logo">MR</div>
        <ul>
            <li><a href="#sobre-mi">Sobre mí</a></li>
            <li><a href="#arquitectura">Arq</a></li>
            <li><a href="#bodas">Bodas</a></li>
        </ul>
    </nav>
</header>

<main>
    <section id="sobre-mi" class="seccion-perfil">
        <div class="perfil-foto">
            <img src="1d0c0231-5ed2-47eb-a76e-e4ad82846d88.jpg" alt="Foto perfil">
        </div>
        <div class="perfil-texto">
            <h2>Sobre mí</h2>
            <p>Arquitecta y fotógrafa basada en Sevilla.</p>
        </div>
    </section>

    <hr class="divisor">

    <section id="arquitectura">
        <h2 class="titulo-seccion">Arquitectura</h2>
        <div class="grid">
            <a class="galeria" href="foto1.jpg"><img src="foto1.jpg" alt="Arq 1"></a>
            <a class="galeria" href="foto2.jpg"><img src="foto2.jpg" alt="Arq 2"></a>
            <a class="galeria" href="foto6.jpg"><img src="foto6.jpg" alt="Arq 3"></a>
        </div>
    </section>

    <section id="bodas">
        <h2 class="titulo-seccion">Bodas</h2>
        <div class="grid">
            <a class="galeria" href="boda.webp"><img src="boda.webp" alt="Boda 1"></a>
            <a class="galeria" href="boda1.webp"><img src="boda1.webp" alt="Boda 2"></a>
            <a class="galeria" href="boda4.webp"><img src="boda4.webp" alt="Boda 4"></a>
        </div>
    </section>
</main>

</body>
</html>
